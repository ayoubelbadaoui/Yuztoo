name: QA

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  flutter-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Match pubspec: flutter: ">=3.41.0"
          flutter-version: "3.41.0"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit + QA scenario tests
        run: flutter test test/qa/

  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/firebase-rules
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: test/firebase-rules/package-lock.json

      - name: Install + run rules tests
        run: |
          npm ci
          npm test
