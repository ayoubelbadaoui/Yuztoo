name: flutter_yuztoo
description: Flutter UI recreation of the High-Fidelity Yuztoo design.
publish_to: "none"
version: 0.0.1+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  cloud_functions: ^6.1.0
  firebase_storage: ^13.3.0
  firebase_messaging: ^16.2.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl_phone_field: ^3.2.0
  shared_preferences: ^2.2.2
  logger: ^2.0.2+1
  image_picker: ^1.0.7
  flutter_svg: ^2.0.10
  http: ^1.2.0
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  gal: ^2.3.2
  # 1.5.1+ requires Dart ^3.10; keep 1.4.x for Dart 3.9 (Flutter 3.35.x).
  wakelock_plus: ^1.4.0
  # 7.x requires Dart ^3.10 / Flutter >=3.38.1; keep 6.x for Flutter 3.35.x (Dart 3.9.x).
  app_links: ^6.4.1
  intl: ^0.20.2
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  url_launcher: ^6.3.2
  flutter_nfc_kit: ^3.6.2
  ndef: ^0.4.0
  flutter_blue_plus: ^1.36.8
  ble_peripheral: ^2.4.0
  universal_platform: ^1.1.0
  image_cropper: ^12.2.1
  firebase_crashlytics: ^5.2.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  mocktail: ^1.0.1
  fake_cloud_firestore: ^4.1.0+1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/logo.svg
    - assets/branding/logo.png
    - assets/branding/app_icon.png
    - assets/branding/app_icon_monochrome.png
# ──────────────────────────────────────────────────────────────────────────────
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"

  # iOS — collapse any alpha to opaque white (App Store requirement).
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

  # Android — legacy mipmap densities at all DPIs.
  android: "ic_launcher"
  min_sdk_android: 23

  # Android adaptive icon (API 26+): keep the iOS look by using the full
  # colored icon as foreground over a white background. Android will inset
  # it inside its own shape (circle / squircle / etc.) automatically.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/app_icon.png"
  # Android 13+ themed icon — must be a monochrome silhouette. The build
  # script below generates this from app_icon.png and writes it to
  # `assets/branding/app_icon_monochrome.png`, then flutter_launcher_icons
  # picks it up here on a second pass.
  adaptive_icon_monochrome: "assets/branding/app_icon_monochrome.png"
