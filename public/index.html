<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1F33" />
  <title>Yuztoo — Le carnet de vos commerces</title>
  <meta name="description" content="Yuztoo, l'app qui rapproche commerçants et clients via un simple geste NFC." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    body { margin: 0; min-height: 100vh; background: #0B1F33; color: #F4EDDD;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; }
    h1 { font-size: 32px; margin: 0 0 12px; }
    p { color: rgba(244, 237, 221, 0.72); max-width: 420px; line-height: 1.5; }
    .row { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .row a { padding: 14px 20px; border-radius: 14px; background: #C9A352; color: #0B1F33; text-decoration: none; font-weight: 700; }
    .row a.secondary { background: transparent; color: #C9A352; border: 1.5px solid #C9A352; }
  </style>
</head>
<body>
  <h1>Yuztoo</h1>
  <p>Le carnet digital qui connecte les commerces de proximité à leurs clients fidèles, en un simple geste NFC.</p>
  <div class="row">
    <a href="https://apps.apple.com/app/yuztoo/">App Store</a>
    <a class="secondary" href="https://play.google.com/store/apps/details?id=com.yuztoo.app">Google Play</a>
  </div>
</body>
</html>
